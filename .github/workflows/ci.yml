name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - run: pnpm verify
      - name: Pack and smoke-test the published surface
        shell: bash
        run: |
          package_name="$(node -p 'require("./package.json").name')"
          tarball="$(npm pack --silent | tail -n 1)"
          archive="$PWD/$tarball"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir" "$archive"' EXIT
          cd "$temp_dir"
          npm init -y >/dev/null
          npm install --ignore-scripts "$archive" >/dev/null
          PACKAGE_NAME="$package_name" node --input-type=module <<'NODE'
          import { createRequire } from 'node:module'
          const require = createRequire(import.meta.url)
          const packageName = process.env.PACKAGE_NAME
          const plugin = await import(packageName)
          if (plugin.name !== packageName || typeof plugin.apply !== 'function' || !plugin.Config) process.exit(1)
          for (const suffix of ['client', 'cordis.patch.yml', 'package.json']) require.resolve(`${packageName}/${suffix}`)
          NODE
